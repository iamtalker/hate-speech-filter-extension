<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>혐오표현 필터</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>혐오표현 필터</h1>
    <label class="switch">
      <input type="checkbox" id="masterToggle" />
      <span class="slider"></span>
    </label>
  </header>

  <p class="note">
    지역명·성별·국적 같은 중립 단어는 차단하지 않고, 실제 멸칭이나 "중립 단어 + 멸칭" 조합이
    함께 등장할 때만 글을 블러 처리합니다. 설정 변경 후에는 페이지를 새로고침 해야 적용됩니다.
  </p>

  <section>
    <div class="section-header">
      <h2>카테고리</h2>
      <div class="header-actions">
        <button id="resetAllBtn" class="reset-btn">기본 카테고리로 초기화</button>
        <button id="deleteAllBtn" class="reset-btn reset-btn-danger">전체 삭제</button>
      </div>
    </div>
    <ul id="categoryList" class="category-list"></ul>
    <div class="add-row">
      <input type="text" id="newCategoryInput" placeholder="새 카테고리 이름 (예: 외모비하)" />
      <button id="addCategoryBtn">추가</button>
    </div>
    <div class="add-row">
      <button id="exportBtn" class="secondary-btn">내보내기</button>
      <button id="importBtn" class="secondary-btn">가져오기</button>
      <input type="file" id="importFileInput" accept="application/json" hidden />
    </div>
  </section>

  <section>
    <h2>제외 사이트</h2>
    <p class="note">여기 등록한 사이트(및 서브도메인)에서는 확장 프로그램이 아예 동작하지 않습니다.</p>
    <div id="excludedSiteList" class="tag-list excluded-site-list"></div>
    <div class="add-row">
      <input type="text" id="newExcludedSiteInput" placeholder="예: example.com" />
      <button id="addExcludedSiteBtn">추가</button>
    </div>
    <button id="addCurrentSiteBtn" class="secondary-btn full-width-btn">현재 보고 있는 사이트 추가</button>
  </section>

  <script src="wordlists.js"></script>
  <script src="settings-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
