<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>혐오표현 필터</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>혐오표현 필터</h1>
    <label class="switch">
      <input type="checkbox" id="masterToggle" />
      <span class="slider"></span>
    </label>
  </header>

  <p class="note">
    지역명·성별·국적 같은 중립 단어는 차단하지 않고, 실제 멸칭이나 "중립 단어 + 멸칭" 조합이
    함께 등장할 때만 글을 가립니다. 설정 변경 후에는 페이지를 새로고침 해야 적용됩니다.
  </p>

  <section>
    <h2>표시 방식</h2>
    <label class="radio-row">
      <input type="radio" name="displayMode" id="displayModeBlur" value="blur" />
      <span><strong>블러 처리</strong> — 흐리게 보이고 클릭하면 볼 수 있음</span>
    </label>
    <label class="radio-row">
      <input type="radio" name="displayMode" id="displayModeHide" value="hide" />
      <span><strong>숨기기</strong> — 안 보이고 클릭하면 볼 수 있음</span>
    </label>
    <label class="radio-row radio-row-danger">
      <input type="radio" name="displayMode" id="displayModeRemove" value="remove" />
      <span><strong>완전 삭제</strong> — 배지도 없이 흔적 없이 사라짐, 다시 볼 수 없음</span>
    </label>
  </section>

  <section>
    <div class="section-header">
      <h2>카테고리</h2>
      <div class="header-actions">
        <button id="deleteAllBtn" class="reset-btn reset-btn-danger">전체 삭제</button>
        <button id="resetAllBtn" class="reset-btn">기본 카테고리로 초기화</button>
        <button id="installPackBtn" class="reset-btn" title="세대·성별·인종·지역·민족·국적·장애 관련 단어를 더 폭넓게 담은 선택 팩입니다. 기존 카테고리는 그대로 두고 없는 단어만 추가합니다.">확장 단어 팩 설치</button>
      </div>
    </div>
    <ul id="categoryList" class="category-list"></ul>
    <div class="add-row">
      <input type="text" id="newCategoryInput" placeholder="새 카테고리 이름 (예: 외모비하)" />
      <button id="addCategoryBtn">추가</button>
    </div>
    <div class="add-row">
      <button id="exportBtn" class="secondary-btn">내보내기</button>
      <button id="importBtn" class="secondary-btn">가져오기</button>
      <input type="file" id="importFileInput" accept="application/json" hidden />
    </div>
  </section>

  <section>
    <h2>제외 사이트</h2>
    <p class="note">등록한 사이트(및 서브도메인)에서는 확장 프로그램이 아예 동작하지 않습니다. 주소에 경로나 검색조건(?id=3)을 붙이면 그 페이지에서만 제외됩니다.</p>
    <div id="excludedSiteList" class="tag-list excluded-site-list"></div>
    <div class="add-row">
      <input type="text" id="newExcludedSiteInput" placeholder="예: example.com 또는 전체 주소" />
      <button id="addExcludedSiteBtn">추가</button>
    </div>
    <div class="add-row">
      <button id="addCurrentSiteBtn" class="secondary-btn" title="지금 보고 있는 사이트 전체를 제외합니다">현재 사이트 추가</button>
      <button id="addCurrentPageBtn" class="secondary-btn" title="지금 보고 있는 이 페이지(주소 전체)만 제외합니다">현재 페이지 추가</button>
    </div>
  </section>

  <script src="wordlists.js"></script>
  <script src="settings-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
